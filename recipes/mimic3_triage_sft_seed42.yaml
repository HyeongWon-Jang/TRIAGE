# Model arguments
model_name_or_path: Qwen/Qwen3-4B-Base
model_revision: main
torch_dtype: bfloat16

dataset_name: mimic3
dataset_path: ./data/mimic3/mimic3_triage_sft.json

# SFT trainer config
dataset_num_proc: 8
optim: adamw_bnb_8bit
bf16: true
do_eval: false
eval_strategy: 'no'
per_device_train_batch_size: 1
gradient_accumulation_steps: 128
gradient_checkpointing: true
push_to_hub: true
hub_model_id: ## Your HF hub model ID
hub_strategy: every_save
hub_private_repo: false
learning_rate: 2e-5
log_level: info
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine
packing: false
max_grad_norm: 1.0
completion_only_loss: true
max_length: 12288
max_steps: -1
num_train_epochs: 3
output_dir: ./model/mimic3_triage_sft
save_strategy: steps
save_steps: 0.08333333333333333
save_total_limit: 1
save_only_model: true
seed: 42  # training seed
warmup_ratio: 0.05
weight_decay: 0.01
group_by_length: false
